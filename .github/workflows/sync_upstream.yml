name: Auto-Sync Upstream Plugins

on:
  schedule:
    # Runs every 12 hours automatically
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout Builds Branch
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Sync CNC Verse Mobile
        run: |
          python3 src/tools/sync_upstream.py builds/plugins.json

      - name: Commit and Push if Changed
        run: |
          cd builds
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add plugins.json
          if [[ -n $(git status -s) ]]; then
            git commit -m "ci: auto-sync CNC Verse Mobile from upstream"
            git push origin builds
          else
            echo "plugins.json is already up to date."
          fi
