name: Build

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout Builds Branch
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3 || true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          set -o pipefail
          BUILD_STATUS=0
          for attempt in 1 2 3; do
            echo "Gradle build attempt $attempt of 3..."
            BUILD_STATUS=0
            ./gradlew :AnimePaheProvider:make makePluginsJson --stacktrace 2>&1 | tee build_output.log && break || BUILD_STATUS=$?
            echo "Attempt $attempt failed with code $BUILD_STATUS, waiting 5s before retry..."
            sleep 5
          done
          
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "::error::Gradle build failed with exit code $BUILD_STATUS"
            cat build_output.log | tail -n 80
            cp build_output.log $GITHUB_WORKSPACE/builds/build_output.log || true
            cd $GITHUB_WORKSPACE/builds
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
            git config --local user.email "actions@github.com"
            git config --local user.name "GitHub Actions"
            git add build_output.log
            git commit -m "Build failure log $GITHUB_SHA" || true
            git push origin builds --force || true
            exit $BUILD_STATUS
          fi

          echo "Searching and copying compiled artifacts..."
          find . -type f -name "*.cs3" -exec cp -v {} $GITHUB_WORKSPACE/builds/ \;
          cp $GITHUB_WORKSPACE/builds/AnimePaheProvider.cs3 $GITHUB_WORKSPACE/builds/AnimePahe.cs3 || true
          find . -type f -name "plugins.json" -exec cp -v {} $GITHUB_WORKSPACE/builds/ \;
          cp repo.json $GITHUB_WORKSPACE/builds/repo.json || true
          cp icon.png $GITHUB_WORKSPACE/builds/icon.png || true
          cp build_output.log $GITHUB_WORKSPACE/builds/build_output.log || true
          echo "Builds contents:"
          ls -la $GITHUB_WORKSPACE/builds/

      - name: Push Builds
        if: success()
        run: |
          cd $GITHUB_WORKSPACE/builds
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -A
          if [[ -n $(git status -s) ]]; then
            git commit -m "Build $GITHUB_SHA"
            git push origin builds --force
          else
            echo "No changes to push"
          fi

      - name: Push Build Failure Log
        if: failure()
        run: |
          cd $GITHUB_WORKSPACE/builds
          cp $GITHUB_WORKSPACE/src/build_output.log ./build_output.log || true
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add build_output.log
          git commit -m "ci: record build failure log" || true
          git push origin builds --force
